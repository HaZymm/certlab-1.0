<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Forgot Password — CertLab</title>
  <link rel="stylesheet" href="forgotpass.css">
</head>
<body>
  <div class="screen">
    <header class="top-logo" role="banner">
      <div class="logo">cert<span>lab</span>.</div>
    </header>

    <main class="wrap">
      <section class="fp-card" aria-labelledby="fp-title">
        <h2 id="fp-title" class="fp-title">Forgot password</h2>

        <form class="fp-form" action="#" method="post">
          <label class="field">
            <span class="label-text">Email</span>
            <input class="input" type="email" name="email" placeholder="example@xxx.com" required>
          </label>

          <button class="btn-primary" type="submit">Send TAC</button>
          <a class="btn-secondary" href="login.html">Back</a>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
